<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Maison Meszarics">
  <title>Maison Meszarics</title>
  <style>
    .mm-disco { transform-origin: 50% 50%; animation: mm-entrar .45s cubic-bezier(.22,.61,.36,1) both; }
    .mm-aro   { animation: mm-aparecer .5s ease-out .9s both; }
    .mm-eme   { stroke-dasharray: 100; stroke-dashoffset: 100;
                animation: mm-trazar 1.05s cubic-bezier(.22,.61,.36,1) .18s forwards; }
    @keyframes mm-entrar   { from { opacity:0; transform:scale(.94) } to { opacity:1; transform:none } }
    @keyframes mm-trazar   { to { stroke-dashoffset: 0 } }
    @keyframes mm-aparecer { from { opacity:0 } to { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      .mm-disco, .mm-aro, .mm-eme { animation: none; opacity:1; stroke-dashoffset:0 }
    }
  </style>
  <circle class="mm-disco" cx="50" cy="50" r="50" fill="#17110f"/>
  <circle class="mm-aro" cx="50" cy="50" r="44.2" fill="none" stroke="#fdf9f8" stroke-opacity=".16" stroke-width=".9"/>
  <path class="mm-eme" pathLength="100" d="M26.5 71.5 V28.5 L50 62 L73.5 28.5 V71.5"
        fill="none" stroke="#fdf9f8" stroke-width="5.2"
        stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6"/>
</svg>
